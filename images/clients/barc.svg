<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54">
  <defs>
    <style>
      .barc-blue { fill: #003366; }
      .barc-gold { fill: #C59B27; }
      .barc-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .barc-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #2D3748; }
    </style>
  </defs>
  <!-- BARC Atomic Research Emblem -->
  <g transform="translate(10, 6)">
    <!-- Outer Seal Ring -->
    <circle cx="21" cy="21" r="20" fill="#003366"/>
    <circle cx="21" cy="21" r="17.5" fill="none" stroke="#C59B27" stroke-width="1.2"/>
    <!-- Atomic Orbit Rings -->
    <ellipse cx="21" cy="21" rx="14" ry="5.5" fill="none" stroke="#FFFFFF" stroke-width="1.1" transform="rotate(30 21 21)"/>
    <ellipse cx="21" cy="21" rx="14" ry="5.5" fill="none" stroke="#FFFFFF" stroke-width="1.1" transform="rotate(-30 21 21)"/>
    <ellipse cx="21" cy="21" rx="14" ry="5.5" fill="none" stroke="#FFFFFF" stroke-width="1.1" transform="rotate(90 21 21)"/>
    <!-- Nucleus Center (Golden Energy Core) -->
    <circle cx="21" cy="21" r="4" fill="#C59B27"/>
    <circle cx="21" cy="21" r="2" fill="#FFFFFF"/>
    <!-- Orbiting Electrons -->
    <circle cx="9" cy="14" r="1.5" fill="#FFD700"/>
    <circle cx="33" cy="28" r="1.5" fill="#FFD700"/>
    <circle cx="21" cy="7" r="1.5" fill="#FFD700"/>
  </g>
  <!-- BARC Typography -->
  <text x="58" y="24" class="barc-blue barc-head" font-size="20" letter-spacing="2">BARC</text>
  <text x="58" y="37" class="barc-sub" font-size="7.5" letter-spacing="0.4">BHABHA ATOMIC RESEARCH CENTRE</text>
  <text x="58" y="47" fill="#666666" font-family="sans-serif" font-size="6.8" font-weight="600">GOVT. OF INDIA · DEPT. OF ATOMIC ENERGY</text>
</svg>

