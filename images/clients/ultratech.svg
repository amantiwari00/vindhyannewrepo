<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54">
  <defs>
    <style>
      .ut-dark { fill: #1C1C1C; }
      .ut-red { fill: #D32F2F; }
      .ut-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .ut-tag { font-family: Georgia, serif; font-style: italic; fill: #455A64; }
    </style>
  </defs>
  <!-- Aditya Birla Rising Sun Emblem -->
  <g transform="translate(10, 8)">
    <!-- Sunburst Radiant Beams -->
    <path d="M4 30 A18 18 0 0 1 38 30 Z" fill="#FFB300"/>
    <path d="M8 30 A14 14 0 0 1 34 30 Z" fill="#E65100"/>
    <path d="M13 30 A9 9 0 0 1 29 30 Z" fill="#D32F2F"/>
    <circle cx="21" cy="30" r="5" fill="#FFEB3B"/>
    <!-- Yellow Horizon Bar -->
    <rect x="0" y="31" width="42" height="3" fill="#FFC600"/>
  </g>
  <!-- UltraTech Brand Typography -->
  <g transform="translate(60, 0)">
    <text x="0" y="24" class="ut-dark ut-head" font-size="18.5" letter-spacing="-0.2">UltraTech</text>
    <text x="0" y="37" class="ut-red ut-head" font-size="10.5" letter-spacing="2">CEMENT</text>
    <text x="0" y="47" class="ut-tag" font-size="7.5">The Engineer's Choice</text>
  </g>
</svg>

