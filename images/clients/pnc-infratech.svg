<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54">
  <defs>
    <style>
      .pnc-blue { fill: #0D47A1; }
      .pnc-gold { fill: #FF8F00; }
      .pnc-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .pnc-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #263238; }
    </style>
  </defs>
  <!-- PNC Infratech Highway / Infrastructure Crest -->
  <g transform="translate(10, 6)">
    <!-- Hexagonal Shield -->
    <polygon points="20,2 38,11 38,31 20,40 2,31 2,11" fill="#0D47A1"/>
    <!-- Expressway Ribbon Cutting Through -->
    <path d="M12 36 L28 6 L24 6 L8 36 Z" fill="#FF8F00"/>
    <path d="M16 36 L32 6 L30 6 L14 36 Z" fill="#FFFFFF"/>
    <!-- Central P Monogram Accent -->
    <circle cx="20" cy="18" r="4.5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- Brand Typography -->
  <g transform="translate(58, 0)">
    <text x="0" y="27" class="pnc-blue pnc-head" font-size="22" letter-spacing="2">PNC</text>
    <text x="0" y="41" class="pnc-sub" font-size="9" letter-spacing="1.2">INFRATECH LIMITED</text>
    <!-- Accent Line -->
    <rect x="0" y="45" width="145" height="2" fill="#FF8F00"/>
  </g>
</svg>

