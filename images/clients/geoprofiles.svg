<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54">
  <defs>
    <style>
      .geo-navy { fill: #1A365D; }
      .geo-teal { fill: #00838F; }
      .geo-brown { fill: #6D4C41; }
      .geo-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .geo-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #546E7A; }
    </style>
  </defs>
  <!-- Geotechnical Exploration & Strata Core Emblem -->
  <g transform="translate(10, 6)">
    <!-- Earth Geological Layers / Hexagon -->
    <polygon points="21,2 39,11 39,31 21,40 3,31 3,11" fill="#1A365D"/>
    <!-- Strata Horizontal Core Bands -->
    <path d="M5 14 L37 14 L37 18 L5 18 Z" fill="#6D4C41"/>
    <path d="M4 21 L38 21 L38 25 L4 25 Z" fill="#00838F"/>
    <path d="M6 28 L36 28 L36 32 L6 32 Z" fill="#8D6E63"/>
    <!-- Core Drill Bit / Vertical Plumb Needle -->
    <line x1="21" y1="5" x2="21" y2="37" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="21" cy="21" r="3" fill="#FFFFFF"/>
  </g>
  <!-- Geo Profiles Typography -->
  <g transform="translate(58, 0)">
    <text x="0" y="24" class="geo-navy geo-head" font-size="16" letter-spacing="1">GEO PROFILES</text>
    <text x="0" y="37" class="geo-sub" font-size="7.5" letter-spacing="0.5">&amp; ENGINEERING SERVICES</text>
    <text x="0" y="47" class="geo-teal" font-family="sans-serif" font-size="6.8" font-weight="700">PVT. LTD. · GEOTECH CONSULTANTS</text>
  </g>
</svg>

