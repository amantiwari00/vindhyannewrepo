<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 54" width="220" height="54">
  <defs>
    <style>
      .hp-blue { fill: #003399; }
      .hp-red { fill: #D32F2F; }
      .hp-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
      .hp-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-weight: 700; fill: #263238; }
    </style>
  </defs>
  <!-- HPCL Official Circular Badge -->
  <g transform="translate(10, 6)">
    <!-- Red Outer Border Ring -->
    <circle cx="21" cy="21" r="20" fill="none" stroke="#D32F2F" stroke-width="2.5"/>
    <!-- Blue Inner Disc -->
    <circle cx="21" cy="21" r="17" fill="#003399"/>
    <!-- White HP Monogram -->
    <text x="21" y="27" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="14.5" fill="#FFFFFF" letter-spacing="-0.5">HP</text>
    <!-- Three Energy Liquid Droplets at Top -->
    <circle cx="16.5" cy="11" r="1.6" fill="#D32F2F"/>
    <circle cx="21" cy="9.5" r="1.8" fill="#D32F2F"/>
    <circle cx="25.5" cy="11" r="1.6" fill="#D32F2F"/>
  </g>
  <!-- HPCL Brand Typography -->
  <g transform="translate(58, 0)">
    <text x="0" y="26" class="hp-blue hp-head" font-size="22" letter-spacing="1">HPCL</text>
    <text x="0" y="38" class="hp-sub" font-size="8" letter-spacing="0.8">HINDUSTAN PETROLEUM</text>
    <text x="0" y="47" class="hp-red" font-family="sans-serif" font-size="6.8" font-weight="700">A MAHARATNA COMPANY</text>
  </g>
</svg>

